<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pulse Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=42" />
</head>
<body class="gem">
  <div class="hist-scrim" id="histScrim"></div>
  <aside class="history" id="histPanel">
    <button class="new-chat" id="newChat" type="button">
      <span class="mark"></span>
      New chat
    </button>
    <p class="hist-label">Recent</p>
    <div class="hist-list" id="histList"></div>
  </aside>

  <div class="workspace">
    <header class="gem-bar">
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Open recent chats" aria-controls="histPanel" aria-expanded="false">
        <i></i><i></i><i></i>
      </button>
      <div class="gem-brand">
        <span class="mark"></span>
        <span class="brand-text">Pulse Studio</span>
      </div>
      <nav class="proj-tabs" id="projTabs" hidden>
        <button type="button" id="navDirs">Directions</button>
        <button type="button" id="navWork">Canvas</button>
        <button type="button" id="navFlow">Flow</button>
        <button type="button" id="navDna">DNA</button>
      </nav>
      <div class="gem-actions">
        <button type="button" class="gem-chip btn" id="dnaChip" aria-expanded="false" aria-controls="dnaDrawer">DNA</button>
      </div>
    </header>

    <div id="app"></div>

    <div class="busy" id="busy" hidden>
      <div class="dots"><i></i><i></i><i></i></div>
      <p id="busyText">Designing…</p>
    </div>

    <form class="composer" id="ask">
      <div class="composer-box">
        <input id="askInput" placeholder="Ask Pulse to design a Careem screen" autocomplete="off" enterkeyhint="send" />
        <button type="submit" id="sendBtn" aria-label="Send">↑</button>
      </div>
    </form>

    <div class="dna-scrim" id="dnaScrim"></div>
    <aside class="dna-drawer" id="dnaDrawer" role="dialog" aria-modal="true" aria-labelledby="dnaTitle">
      <div class="dna-head">
        <div>
          <p class="dna-kicker">Style Memory</p>
          <b id="dnaTitle">How Pulse designs</b>
        </div>
        <button type="button" id="dnaClose" aria-label="Close">✕</button>
      </div>
      <div id="dnaBody"></div>
    </aside>

    <div class="learn-bar" id="learnBar" hidden>
      <b>Studio learned</b>
      <span id="learnText"></span>
      <button type="button" data-learn="keep">Keep</button>
      <button type="button" data-learn="project">This project</button>
      <button type="button" data-learn="ignore">Ignore</button>
    </div>
  </div>
  <script src="studio.js?v=42"></script>
</body>
</html>
