<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=19" />
</head>
<body class="gem">
  <aside class="history">
    <button class="new-chat" id="newChat" type="button">
      <span class="mark"></span>
      New chat
    </button>
    <p class="hist-label">Recent</p>
    <div class="hist-list" id="histList"></div>
  </aside>

  <div class="workspace">
    <header class="gem-bar">
      <div class="gem-brand">
        <span class="mark"></span>
        Pulse Studio
      </div>
      <nav class="proj-tabs" id="projTabs" hidden>
        <button type="button" id="navDirs">Directions</button>
        <button type="button" id="navWork">Canvas</button>
        <button type="button" id="navFlow">Flow</button>
        <button type="button" id="navDna">DNA</button>
      </nav>
      <div class="gem-actions">
        <button type="button" class="gem-chip btn" id="dnaChip">DNA</button>
      </div>
    </header>

    <div id="app"></div>

    <div class="busy" id="busy" hidden>
      <div class="dots"><i></i><i></i><i></i></div>
      <p id="busyText">Designing…</p>
    </div>

    <form class="composer" id="ask">
      <div class="composer-box">
        <input id="askInput" placeholder="Ask Pulse to design a Careem screen" autocomplete="off" />
        <button type="submit" id="sendBtn" aria-label="Send">↑</button>
      </div>
    </form>

    <aside class="dna-drawer" id="dnaDrawer" hidden>
      <div class="dna-head">
        <b>Style Memory</b>
        <button type="button" id="dnaClose">Close</button>
      </div>
      <div id="dnaBody"></div>
    </aside>

    <div class="learn-bar" id="learnBar" hidden>
      <b>Studio learned</b>
      <span id="learnText"></span>
      <button type="button" data-learn="keep">Keep</button>
      <button type="button" data-learn="project">This project</button>
      <button type="button" data-learn="ignore">Ignore</button>
    </div>
  </div>
  <script src="studio.js?v=19"></script>
</body>
</html>
